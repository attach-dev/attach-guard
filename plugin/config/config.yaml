provider:
  kind: open-score
  command: attach-open-score
  # When an Open Score API token is provided (plugin prompt / score.env),
  # bootstrap.sh promotes the provider to the hosted endpoint and the token is
  # read from this env var. With no token, the local `command` above is used.
  api_token_env: ATTACH_OPEN_SCORE_API_TOKEN
policy:
  deny_known_malware: true
  min_supply_chain_score: 70
  min_overall_score: 70
  gray_band_min_supply_chain_score: 50
  minimum_package_age_hours: 48
  provider_unavailable_behavior:
    local: ask
    ci: deny
  unknown_behavior:
    local: ask
    ci: deny
  auto_rewrite_unpinned:
    local: false
    ci: false
  allowlist: []
  denylist: []
package_managers:
  npm: true
  pnpm: true
  pip: true
  go: true
  cargo: true
logging:
  path: "~/.attach-guard/audit.jsonl"
